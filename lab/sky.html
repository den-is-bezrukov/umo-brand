<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Небо — прототип</title>
<!-- Trial of a shader hero for the guide, in the palette of the business card and certificate (Figma 4020:2516,
     4667:3846). Served by the dev server only (http://localhost:5477/lab/sky.html); the build doesn't include it. -->
<style>
  @font-face { font-family: 'CoFo Sans'; font-weight: 500; src: url('/fonts/CoFoSans-Medium.woff2') format('woff2'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #000; font-family: 'CoFo Sans', system-ui, sans-serif; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: calc(100% - var(--strip, 0px)); display: block; }
  .logo { position: fixed; left: 36px; top: 36px; width: 200px; color: #fff; }
  .strip { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; padding: 24px 36px 96px; }
  .strip p { margin: 0; max-width: 912px; font-size: min(60px, 6vw); font-weight: 500; line-height: 1; letter-spacing: -0.01em; }
  .mock-off .logo, .mock-off .strip { display: none; }
  .panel { position: fixed; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 12px; padding: 16px;
    background: rgba(255,255,255,.92); border-radius: 16px; font-size: 14px; width: 272px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button, .row button { font: inherit; border: 0; border-radius: 8px; padding: 6px 10px; background: #eee; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: #000; color: #fff; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  input[type=range] { width: 120px; accent-color: #000; }
  .row { display: flex; gap: 4px; }
  @media (max-width: 640px) {
    .logo { left: 16px; top: 16px; width: 120px; }
    .strip { padding: 16px 16px 72px; }
    .strip p { font-size: 32px; }
    .panel { top: auto; bottom: 16px; left: 16px; right: 16px; width: auto; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg class="logo" viewBox="0 0 480 96" fill="currentColor" aria-hidden="true">
  <path d="M218.401 34.8H182.399V96H146.4V34.6746C146.4 10.0442 158.096 0 182.399 0H218.401V34.8ZM290.398 0C314.693 0 326.4 10.0299 326.4 34.6746V96H290.398V34.8H254.399V96H218.401V34.8H254.399V0H290.398Z" />
  <path d="M98.4 61.2H36V0H0V61.3254C0 85.9702 11.7204 96 36.0301 96H98.3663C122.694 96 134.4 85.9558 134.4 61.3254V0H98.4V61.2Z" />
  <path fill-rule="evenodd" d="M443.973 0C468.284 0 480 10.0299 480 34.6746V61.3254C480 85.9558 468.299 96 443.973 96H374.43C350.116 96 338.4 85.9702 338.4 61.3254V34.6746C338.4 10.0442 350.116 0 374.43 0H443.973ZM374.4 61.2H444V34.6746L374.4 34.8V61.2Z" />
</svg>
<div class="strip"><p>Автомобильный бренд, созданный в&nbsp;технологическом партнёрстве с&nbsp;Яндексом</p></div>

<div class="panel">
  <div class="tabs" id="tabs">
    <button data-v="0">Закат</button>
    <button data-v="1">Марево</button>
    <button data-v="2">Облака</button>
    <button data-v="3">Горизонт</button>
  </div>
  <label>Скорость <input id="speed" type="range" min="0" max="3" step="0.05" value="1" /></label>
  <label>Турбуленция <input id="warp" type="range" min="0" max="2" step="0.05" value="1" /></label>
  <label>Зерно <input id="grain" type="range" min="0" max="1" step="0.01" value="0.3" /></label>
  <div class="row">
    <button id="flip">Перевернуть</button>
    <button id="mock">Без макета</button>
  </div>
</div>

<script type="x-shader/x-fragment" id="fs">#version 300 es
precision highp float;
uniform vec2 R;      // canvas size, px
uniform float T;     // time, s (already scaled by the speed)
uniform float G;     // grain 0..1
uniform float W;     // turbulence 0..2
uniform float F;     // 1: light at the top
uniform int V;       // variant
out vec4 o;

float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), u.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float s = 0., a = .5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) { s += a * n(p); p = m * p; a *= .5; }
  return s;
}
// The brand gradient, black → maroon → red → peach, sampled from the certificate (Figma 4667:3846)
vec3 pal(float t) {
  t = clamp(t, 0., 1.);
  vec3 c0 = vec3(0), c1 = vec3(46, 1, 1) / 255., c2 = vec3(128, 26, 0) / 255.,
       c3 = vec3(196, 49, 0) / 255., c4 = vec3(224, 112, 61) / 255., c5 = vec3(255, 205, 154) / 255.;
  if (t < .3) return mix(c0, c1, t / .3);
  if (t < .5) return mix(c1, c2, (t - .3) / .2);
  if (t < .65) return mix(c2, c3, (t - .5) / .15);
  if (t < .8) return mix(c3, c4, (t - .65) / .15);
  return mix(c4, c5, (t - .8) / .2);
}

void main() {
  vec2 uv = gl_FragCoord.xy / R;
  float a = R.x / R.y;
  float x = uv.x, y = 1. - uv.y;          // y: 0 at the top
  if (F > .5) y = 1. - y;
  vec3 col;

  if (V == 0) {
    // Закат: the gradient's bands drift and wave, as a dusk sky
    vec2 q = vec2(x * a, y) * 1.4;
    float w = fbm(q * vec2(.7, 1.8) + vec2(T * .04, 0.));
    float w2 = fbm(q + vec2(-T * .02, T * .015) + w * 1.6);
    col = pal(y + (w2 - .5) * .32 * W);
  } else if (V == 1) {
    // Марево: long horizontal streaks, as heat haze over asphalt
    vec2 q = vec2(x * a * .5, y * 5.);
    float w = fbm(q + vec2(T * .07, -T * .01));
    float w2 = fbm(q * vec2(1., 1.6) + vec2(w * 2.2, w * .6) - vec2(T * .05, 0.));
    col = pal(y + (w2 - .5) * .2 * W);
  } else if (V == 2) {
    // Облака: masses of cloud lit from below, brighter towards the horizon
    vec2 q = vec2(x * a, y * 1.6) * 2.2;
    float d = fbm(q * .6 + vec2(T * .02, 0.));
    float c = fbm(q + vec2(T * .035, 0.) + d * 1.4 * W);
    float lit = smoothstep(.35, .75, c);
    col = pal(y * .9 + (lit - .4) * .45 * W * (.35 + .65 * y));
  } else {
    // Горизонт: the sky over a dark road, its markings running towards you
    float hy = .58;
    float sx = (x - .5) * a;
    if (y < hy) {
      float w = fbm(vec2(sx * 1.2, y * 6.) + vec2(T * .03, 0.));
      float t = y / hy * .92 + (w - .5) * .08 * W;
      float d = length(vec2(sx * .7, (y - hy) * 2.2));
      col = pal(t + .22 * exp(-d * 3.5));
    } else {
      float dy = y - hy;
      float z = .32 / dy;                  // depth
      float X = sx * z;                    // across the road
      float fade = exp(-z * .35) * smoothstep(0., .02, dy);
      float lw = fwidth(X) * 1.2;
      float edge = 1. - smoothstep(.012, .012 + lw, abs(abs(X) - .6));
      float dash = (1. - smoothstep(.018, .018 + lw, abs(X))) * step(fract(z * .9 - T * .9), .5);
      vec3 ground = mix(pal(.03), pal(.55), exp(-dy * 18.) * .55);
      col = mix(ground, pal(.9), (edge + dash) * fade);
    }
  }

  // Grain, and a little dither that keeps the dark gradient from banding even at 0
  float g = h(gl_FragCoord.xy + fract(T * 7.) * 91.) - .5;
  col += g * (1.5 + G * 28.) / 255.;
  o = vec4(col, 1);
}
</script>
<script>
  const canvas = document.getElementById('c')
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false })
  const vs = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0, 1); }`
  function shader(type, src) {
    const s = gl.createShader(type)
    gl.shaderSource(s, src)
    gl.compileShader(s)
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s))
    return s
  }
  const prog = gl.createProgram()
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs))
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent))
  gl.linkProgram(prog)
  gl.useProgram(prog)
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
  gl.enableVertexAttribArray(0)
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)
  const u = Object.fromEntries(['R', 'T', 'G', 'W', 'F', 'V'].map((k) => [k, gl.getUniformLocation(prog, k)]))

  const state = { v: 0, speed: 1, warp: 1, grain: 0.3, flip: 0 }
  try { Object.assign(state, JSON.parse(localStorage.getItem('sky') || '{}')) } catch {}
  const save = () => { try { localStorage.setItem('sky', JSON.stringify(state)) } catch {} }

  const tabs = [...document.querySelectorAll('#tabs button')]
  const sync = () => tabs.forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.v === state.v)))
  tabs.forEach((b) => b.addEventListener('click', () => { state.v = +b.dataset.v; sync(); save() }))
  for (const k of ['speed', 'warp', 'grain']) {
    const el = document.getElementById(k)
    el.value = state[k]
    el.addEventListener('input', () => { state[k] = +el.value; save() })
  }
  document.getElementById('flip').addEventListener('click', () => { state.flip = 1 - state.flip; save() })
  const mock = document.getElementById('mock')
  mock.addEventListener('click', () => {
    document.body.classList.toggle('mock-off')
    mock.textContent = document.body.classList.contains('mock-off') ? 'С макетом' : 'Без макета'
  })
  sync()

  // Drawn at CSS pixels, not the screen's: a soft gradient doesn't need retina, and it's a quarter of the work
  // With the mock on, the sky takes what the white strip leaves, as the guide's first screen shows it
  const strip = document.querySelector('.strip')
  function resize() {
    const off = document.body.classList.contains('mock-off') ? 0 : strip.offsetHeight
    document.body.style.setProperty('--strip', off + 'px')
    const w = Math.round(innerWidth), h = Math.round(innerHeight - off)
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h }
    gl.viewport(0, 0, w, h)
  }
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches
  let t = 0, last = performance.now()
  function frame(now) {
    t += (still ? 0 : Math.min(now - last, 100) / 1000) * state.speed
    last = now
    resize()
    gl.uniform2f(u.R, canvas.width, canvas.height)
    gl.uniform1f(u.T, t + 20)
    gl.uniform1f(u.G, state.grain)
    gl.uniform1f(u.W, state.warp)
    gl.uniform1f(u.F, state.flip)
    gl.uniform1i(u.V, state.v)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
</script>
</body>
</html>
