<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Небо — прототип</title>
<!-- Trial of a shader hero for the guide, built on the UMO wordmark, in the palette of the business card and
     certificate (Figma 4020:2516, 4667:3846). Served by the dev server only (http://localhost:5477/lab/sky.html);
     the build doesn't include it. The earlier gradient skies (Закат, Марево, Облака, Горизонт) are in 8b87bc8, Хром in
     9f56f7c^, Облако parked in cloud.html -->
<style>
  @font-face { font-family: 'CoFo Sans'; font-weight: 500; src: url('/fonts/CoFoSans-Medium.woff2') format('woff2'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #000; font-family: 'CoFo Sans', system-ui, sans-serif; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: calc(100% - var(--strip, 0px)); display: block; }
  .strip { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; padding: 24px 36px 96px; }
  .strip p { margin: 0; max-width: 912px; font-size: min(60px, 6vw); font-weight: 500; line-height: 1; letter-spacing: -0.01em; }
  .mock-off .strip { display: none; }
  .panel { position: fixed; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 12px; padding: 16px;
    background: rgba(255,255,255,.92); border-radius: 16px; font-size: 14px; width: 272px;
    max-height: calc(100% - 32px); overflow: auto; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button, .row button { font: inherit; border: 0; border-radius: 8px; padding: 6px 10px; background: #eee; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: #000; color: #fff; }
  .sliders { display: flex; flex-direction: column; gap: 8px; }
  [hidden] { display: none !important; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  input[type=range] { width: 120px; accent-color: #000; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
  @media (max-width: 640px) {
    .strip { padding: 16px 16px 72px; }
    .strip p { font-size: 32px; }
    .panel { top: auto; bottom: 16px; left: 16px; right: 16px; width: auto; max-height: 45%; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="strip"><p>Автомобильный бренд, созданный в&nbsp;технологическом партнёрстве с&nbsp;Яндексом</p></div>

<div class="panel">
  <div class="tabs" id="tabs">
    <button data-v="2">Тоннель</button>
  </div>
  <div id="sliders" class="sliders"></div>
  <div class="row">
    <button id="seed"></button>
    <button id="mock">Без макета</button>
  </div>
</div>

<script type="x-shader/x-fragment" id="fs">#version 300 es
precision highp float;
uniform vec2 R;      // canvas size, px
uniform float T;     // time, s (already scaled by the speed)
uniform float S;     // seed
uniform int V;       // variant
out vec4 o;

float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), u.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float s = 0., a = .5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 4; i++) { s += a * n(p); p = m * p; a *= .5; }
  return s;
}
float h3(vec3 p) { p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float n3(vec3 x) {
  vec3 i = floor(x), f = fract(x);
  f = f * f * (3. - 2. * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1, 0, 0)), f.x), mix(h3(i + vec3(0, 1, 0)), h3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(h3(i + vec3(0, 0, 1)), h3(i + vec3(1, 0, 1)), f.x), mix(h3(i + vec3(0, 1, 1)), h3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm3(vec3 p) {
  float s = 0., a = .5;
  for (int i = 0; i < 3; i++) { s += a * n3(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= .5; }
  return s;
}
// The brand gradient, black → maroon → red → peach, sampled from the certificate (Figma 4667:3846)
vec3 pal(float t) {
  t = clamp(t, 0., 1.);
  vec3 c0 = vec3(0), c1 = vec3(46, 1, 1) / 255., c2 = vec3(128, 26, 0) / 255.,
       c3 = vec3(196, 49, 0) / 255., c4 = vec3(224, 112, 61) / 255., c5 = vec3(255, 205, 154) / 255.;
  if (t < .3) return mix(c0, c1, t / .3);
  if (t < .5) return mix(c1, c2, (t - .3) / .2);
  if (t < .65) return mix(c2, c3, (t - .5) / .15);
  if (t < .8) return mix(c3, c4, (t - .65) / .15);
  return mix(c4, c5, (t - .8) / .2);
}

// The UMO wordmark as a distance field, in the units of umo-logo.svg (480×96, y down): boxes, the rounded
// ones with per-corner radii (x: bottom right, y: top right, z: bottom left, w: top left)
float box(vec2 p, vec2 c, vec2 b) { vec2 d = abs(p - c) - b; return length(max(d, 0.)) + min(max(d.x, d.y), 0.); }
float rbox(vec2 p, vec2 c, vec2 b, vec4 r) {
  p -= c;
  r.xy = p.x > 0. ? r.xy : r.zw;
  r.x = p.y > 0. ? r.x : r.y;
  vec2 q = abs(p) - b + r.x;
  return min(max(q.x, q.y), 0.) + length(max(q, 0.)) - r.x;
}
float logo(vec2 p) {
  float u = max(rbox(p, vec2(67.2, 48), vec2(67.2, 48), vec4(35, 0, 35, 0)), -box(p, vec2(67.2, 25.6), vec2(31.2, 35.6)));
  float m = max(rbox(p, vec2(182.4, 48), vec2(36, 48), vec4(0, 0, 0, 34.8)), -box(p, vec2(206.2, 72.4), vec2(23.8, 37.6)));
  m = min(m, box(p, vec2(236.4, 65.4), vec2(18, 30.6)));
  m = min(m, max(rbox(p, vec2(290.4, 48), vec2(36, 48), vec4(0, 36, 0, 0)), -box(p, vec2(267.4, 72.4), vec2(23, 37.6))));
  float o = max(rbox(p, vec2(409.2, 48), vec2(70.8, 48), vec4(36)), -box(p, vec2(409.2, 48), vec2(34.8, 13.2)));
  return min(u, min(m, o));
}
// The wordmark 4 units wide, centred, y up, extruded ±.35 deep
float logo3(vec3 p) {
  float d = logo(vec2(p.x, -p.y) * 120. + vec2(240, 48)) / 120.;
  vec2 w = vec2(d, abs(p.z) - .35);
  return min(max(w.x, w.y), 0.) + length(max(w, 0.)) - .03;
}

uniform vec2 uMouse;   // -1..1, eased
uniform float uMouseK; // how much the mouse steers

// ── Тоннель: flying through wordmarks lined up into the distance, twisting as the road bends ──
uniform float uLayers, uDepth, uTwist, uBend, uLine, uGlow, uFill, uTone, uZoom;
uniform float uTravel; // how far we've flown: the clock, sped up by Газ
uniform float uBoost;  // how much faster than the speed set, now
uniform float uBank;   // the mouse rolls the tunnel, as a car leaning into a turn
uniform float uLamp;   // the lines brighten round the pointer
vec3 tunnel(vec2 sp) {
  vec3 acc = vec3(0);
  float px = 1. / R.y;
  float gap = uDepth / uLayers;
  for (int i = 0; i < 64; i++) {
    if (float(i) >= uLayers) break;
    float last = float(i) + 1. > uLayers ? fract(uLayers) : 1.;   // a layer coming or going fades
    float z = mod(float(i) * gap - uTravel, uDepth) + .06;
    float ang = z * .22 * uTwist + sin(T * .25 + S) * .5 * uTwist - uMouse.x * uBank * .6;
    vec2 bend = vec2(sin(z * .6 + T * .5 + S), cos(z * .45 + T * .4 + S * 2.)) * .12 * uBend * z;
    // The mouse steers: the far end of the tunnel follows it, the near layers hardly move
    vec2 steer = uMouse * uMouseK * .1 * z;
    vec2 p = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * (sp - (bend + steer) / z * .4);
    vec2 v = p * z / uZoom;                               // world, the wordmark 4 wide
    float d = logo(vec2(v.x, -v.y) * 120. + vec2(240, 48)) / 120. * uZoom / z;
    float fade = smoothstep(uDepth + .05, uDepth * .6, z) * smoothstep(.06, .5, z);
    vec3 c = pal(mix(1., .38, z / uDepth) + uTone);
    float line = smoothstep(px * uLine * (1. + uBoost * .15), 0., abs(d)) + exp(-abs(d) * 70.) * .45 * uGlow * (1. + uBoost * .4);
    acc += c * (line * .55 + (d < 0. ? uFill * .15 : 0.)) * fade * last;
  }
  acc *= 1. + uLamp * 2.5 * exp(-length(sp - uMouse * vec2(R.x / R.y, 1.) * .5) * 5.);
  vec3 bg = pal(.12 + uTone * .3 - .1 * length(sp));
  return bg + acc;
}

void main() {
  float a = R.x / R.y;
  vec2 sp = (gl_FragCoord.xy - R * .5) / R.y;              // centred, y up, 1 = canvas height
  vec3 col;
  col = tunnel(sp);
  // A dither under a level apart, so the dark gradient doesn't band
  col += (h(gl_FragCoord.xy + fract(T * 7.) * 91.) - .5) * 1.5 / 255.;
  o = vec4(col, 1);
}
</script>
<script>
  const canvas = document.getElementById('c')
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false })
  const vs = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0, 1); }`
  function shader(type, src) {
    const s = gl.createShader(type)
    gl.shaderSource(s, src)
    gl.compileShader(s)
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s))
    return s
  }
  const prog = gl.createProgram()
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs))
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent))
  gl.linkProgram(prog)
  gl.useProgram(prog)
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
  gl.enableVertexAttribArray(0)
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)
  // Speed, mouse and seed are each variant's own
  // (`speed2`, `seed0`…), so setting one doesn't change the other
  // Sliders: speed scales the clock, the rest are uniforms of the same name; `only` lists the variants they act on
  const CONTROLS = [
    { id: 'speed', label: 'Скорость', min: 0, max: 3, step: 0.05, def: 0.25, own: true },
    { id: 'uLayers', label: 'Слои', min: 4, max: 64, step: 1, def: 14, only: [2] },
    { id: 'uDepth', label: 'Глубина', min: 2, max: 14, step: 0.1, def: 2, only: [2] },
    { id: 'uZoom', label: 'Масштаб', min: 0.4, max: 3, step: 0.01, def: 0.4, only: [2] },
    { id: 'uTwist', label: 'Закрутка', min: 0, max: 3, step: 0.01, def: 0, only: [2] },
    { id: 'uBend', label: 'Изгиб', min: 0, max: 3, step: 0.01, def: 2.44, only: [2] },
    { id: 'uLine', label: 'Линия', min: 0.5, max: 6, step: 0.1, def: 1.2, only: [2] },
    { id: 'uGlow', label: 'Свечение', min: 0, max: 3, step: 0.01, def: 0.64, only: [2] },
    { id: 'uFill', label: 'Заливка', min: 0, max: 1, step: 0.01, def: 0, only: [2] },
    { id: 'uTone', label: 'Тон', min: -0.5, max: 0.3, step: 0.01, def: 0, only: [2] },
    { id: 'uMouseK', label: 'Мышь', min: 0, max: 2, step: 0.01, def: 2, only: [2], own: true },
    // Тоннель's mouse: Крен rolls it, Газ speeds it up while pressed, Слои мышью: the pointer up adds layers and
    // down takes them away (up to twice and half as many at 1), Фонарь lights it round the pointer
    { id: 'uBank', label: 'Крен', min: 0, max: 2, step: 0.01, def: 1, only: [2] },
    { id: 'gas', label: 'Газ', min: 0, max: 3, step: 0.01, def: 1, only: [2] },
    { id: 'layersK', label: 'Слои мышью', min: 0, max: 2, step: 0.01, def: 1, only: [2] },
    { id: 'uLamp', label: 'Фонарь', min: 0, max: 2, step: 0.01, def: 0.5, only: [2] },
  ]
  const names = ['R', 'T', 'S', 'V', 'uMouse', 'uTravel', 'uBoost', ...CONTROLS.map((c) => c.id)]
  const u = Object.fromEntries(names.map((k) => [k, gl.getUniformLocation(prog, k)]))

  // Тоннель as Denis last set it (2026-10-15); they override the sliders' own defaults
  const SET = {
    seed2: 15, speed2: 0.3, uMouseK2: 0.42, uLayers: 50, uDepth: 10.6, uZoom: 0.51, uTwist: 0, uBend: 0,
    uLine: 0.8, uGlow: 0.38, uFill: 0, uTone: -0.17, uBank: 0.26, gas: 3, layersK: 0.26, uLamp: 2,
  }
  const state = { v: 2, ...Object.fromEntries(CONTROLS.map((c) => [c.id, c.def])), ...SET }
  const OWN = Object.fromEntries(CONTROLS.filter((c) => c.own).map((c) => [c.id, c.def]))
  const key = (id) => (id === 'seed' || id in OWN ? id + state.v : id)
  const get = (id) => state[key(id)] ?? OWN[id]
  try { Object.assign(state, JSON.parse(localStorage.getItem('sky-logo4') || '{}')) } catch {}
  const save = () => { try { localStorage.setItem('sky-logo4', JSON.stringify(state)) } catch {} }

  const sliders = document.getElementById('sliders')
  for (const c of CONTROLS) {
    const label = document.createElement('label')
    label.textContent = c.label + ' '
    if (c.only) label.dataset.only = c.only.join(' ')
    const el = Object.assign(document.createElement('input'), { type: 'range', min: c.min, max: c.max, step: c.step })
    el.dataset.id = c.id
    el.addEventListener('input', () => { state[key(c.id)] = +el.value; save() })
    label.append(el)
    sliders.append(label)
  }

  const tabs = [...document.querySelectorAll('#tabs button')]
  const seed = document.getElementById('seed')
  const sync = () => {
    tabs.forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.v === state.v)))
    document.querySelectorAll('[data-only]').forEach((el) => {
      el.hidden = !el.dataset.only.split(' ').map(Number).includes(state.v)
    })
    sliders.querySelectorAll('input').forEach((el) => { el.value = get(el.dataset.id) })
    seed.textContent = `Сид ${get('seed')}`
  }
  tabs.forEach((b) => b.addEventListener('click', () => { state.v = +b.dataset.v; sync(); save() }))
  seed.addEventListener('click', () => { state[key('seed')] = (get('seed') % 99) + 1; sync(); save() })
  const mock = document.getElementById('mock')
  mock.addEventListener('click', () => {
    document.body.classList.toggle('mock-off')
    mock.textContent = document.body.classList.contains('mock-off') ? 'С макетом' : 'Без макета'
  })
  sync()

  // The pointer over the picture, -1..1 from its centre, y up; the shader gets it eased
  // Pressing on the picture is Газ
  const aim = [0, 0], mouse = [0, 0]
  let pressed = false, boost = 0, travel = 0
  addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect()
    const x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1))
    const y = Math.max(-1, Math.min(1, 1 - ((e.clientY - r.top) / r.height) * 2))
    aim[0] = x
    aim[1] = y
  })
  canvas.style.touchAction = 'none'
  canvas.addEventListener('pointerdown', (e) => { pressed = true; canvas.setPointerCapture(e.pointerId) })
  addEventListener('pointerup', () => { pressed = false })
  addEventListener('pointercancel', () => { pressed = false })

  // Drawn at CSS pixels, not the screen's. With the mock on, the picture takes what the white strip leaves, as the guide's first
  // screen shows it
  const strip = document.querySelector('.strip')
  function resize() {
    const off = document.body.classList.contains('mock-off') ? 0 : strip.offsetHeight
    document.body.style.setProperty('--strip', off + 'px')
    const k = 1
    const w = Math.round(innerWidth * k), h = Math.round((innerHeight - off) * k)
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h }
    gl.viewport(0, 0, w, h)
  }
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches
  let t = 0, last = performance.now()
  function frame(now) {
    const dt = still ? 0 : Math.min(now - last, 100) / 1000
    t += dt * get('speed')
    last = now
    for (const i of [0, 1]) mouse[i] += (aim[i] - mouse[i]) * 0.06
    const goal = pressed ? get('gas') * 4 : 0
    boost += (goal - boost) * (goal > boost ? 0.08 : 0.03)
    travel += dt * 1.4 * (get('speed') + boost * Math.max(get('speed'), 0.25))
    gl.uniform1f(u.uTravel, travel)
    gl.uniform1f(u.uBoost, boost)
    resize()
    gl.uniform2f(u.R, canvas.width, canvas.height)
    gl.uniform1f(u.T, t + 3)
    gl.uniform1f(u.S, get('seed'))
    gl.uniform1i(u.V, state.v)
    gl.uniform2f(u.uMouse, mouse[0], mouse[1])
    for (const c of CONTROLS) if (c.id !== 'speed') gl.uniform1f(u[c.id], get(c.id))
    gl.uniform1f(u.uLayers, Math.max(2, Math.min(64, get('uLayers') * 2 ** (mouse[1] * get('layersK')))))
    gl.drawArrays(gl.TRIANGLES, 0, 3)
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
</script>
</body>
</html>
