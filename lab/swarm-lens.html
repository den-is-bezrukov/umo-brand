<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Рой в линзе — прототип</title>
<!-- Рой в линзе with its sliders: the picture itself is src/guide/hero/swarmLens.ts, the same the guide's first
     screen draws. Запомнить keeps the sliders in this browser, Сброс returns to them; В гайд writes them to
     src/guide/hero.json (the dev server's vite plugin `hero-save`), which the guide's first screen takes at once —
     commit and push it to publish. Dev server only: http://localhost:5477/lab/swarm-lens.html -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; right: 12px; top: 12px; padding: 8px 10px; background: Canvas; color: CanvasText;
    border: 1px solid GrayText; font: 12px system-ui, sans-serif; width: 300px; max-height: calc(100% - 24px); overflow: auto; }
  .group + .group { margin-top: 10px; }
  label { display: grid; grid-template-columns: 1fr 120px 36px; align-items: center; gap: 6px; }
  label output { text-align: right; font-variant-numeric: tabular-nums; }
  .buttons { display: flex; gap: 6px; margin-top: 10px; }
  .buttons button { flex: 1; font: inherit; }
  @media (max-width: 640px) { .panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 45%; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <div id="sliders"></div>
  <div class="buttons"><button id="save">Запомнить</button><button id="reset">Сброс</button><button id="publish">В гайд</button></div>
</div>

<script type="module">
import { GROUPS, CONTROLS, DEFAULTS, swarmLens } from '/src/guide/hero/swarmLens.ts'
import hero from '/src/guide/hero.json'

const box = document.getElementById('sliders')
for (const g of GROUPS) {
  const div = document.createElement('div')
  div.className = 'group'
  for (const [id, name, min, max, step, val] of g)
    div.insertAdjacentHTML('beforeend', `<label>${name} <input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" /><output></output></label>`)
  box.append(div)
}
const $ = id => document.getElementById(id)
const values = () => Object.fromEntries(CONTROLS.map(([id]) => [id, +$(id).value]))
const show = () => { for (const [id, , , , step] of CONTROLS) $(id).nextElementSibling.value = step >= 1 ? $(id).value : (+$(id).value).toFixed(2) }

// Запомнить keeps the panel's values in this browser, Сброс returns to them (to the guide's, hero.json, without any);
// the page opens with them too
const KEY = 'swarm-lens-lab'
function load() {
  let saved = {}
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {} } catch {}
  for (const [id] of CONTROLS) $(id).value = saved[id] ?? hero[id] ?? DEFAULTS[id]
  show()
}
$('save').onclick = () => { try { localStorage.setItem(KEY, JSON.stringify(values())) } catch {} }
$('reset').onclick = load
// В гайд: the values into src/guide/hero.json, through the dev server
$('publish').onclick = async () => {
  const b = $('publish')
  const r = await fetch('/__hero', { method: 'POST', body: JSON.stringify(values()) }).catch(() => null)
  b.textContent = r?.ok ? 'В гайде' : 'Не вышло'
  setTimeout(() => { b.textContent = 'В гайд' }, 1500)
}
box.addEventListener('input', show)
load()
swarmLens($('c'), values)
</script>
</body>
</html>
