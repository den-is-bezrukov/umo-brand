name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for oversized images
        run: |
          big=$(find src public -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -size +2560k)
          if [ -n "$big" ]; then
            echo "These images are over 2.5MB — compress before committing:"
            echo "$big"
            exit 1
          fi
      - name: Check for oversized videos
        run: |
          big=$(find src public -type f \( -iname '*.mp4' -o -iname '*.webm' \) -size +15360k)
          if [ -n "$big" ]; then
            echo "These videos are over 15MB — compress before committing:"
            echo "$big"
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: pnpm build
      # Metrika's Webvisor replays a visit with the stylesheet it had, fetched from the site at viewing time, and every
      # deploy replaces the hashed CSS. So the stylesheets of the last 15 days (as long as Webvisor keeps recordings)
      # are carried over from the live site, listed in css-archive.txt with the last time each was current
      - name: Keep the last 15 days' stylesheets for Webvisor
        run: |
          curl -sf --max-time 10 https://umo.autos/css-archive.txt -o old.txt || touch old.txt
          now=$(date +%s)
          : > dist/css-archive.txt
          for f in dist/assets/*.css; do echo "$(basename "$f") $now" >> dist/css-archive.txt; done
          while read -r name ts; do
            [[ "$name" =~ ^[A-Za-z0-9_-]+\.css$ && "$ts" =~ ^[0-9]+$ ]] || continue
            [ -e "dist/assets/$name" ] && continue
            [ $((now - ts)) -gt $((15 * 86400)) ] && continue
            # 10 s at most per file, so a slow site never holds the deploy; a file cut off is dropped, not kept half
            if curl -sf --max-time 10 "https://umo.autos/assets/$name" -o "dist/assets/$name"; then echo "$name $ts" >> dist/css-archive.txt; else rm -f "dist/assets/$name"; fi
          done < old.txt
          echo "Stylesheets kept: $(wc -l < dist/css-archive.txt)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
