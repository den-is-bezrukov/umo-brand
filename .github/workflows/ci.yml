name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for oversized images
        run: |
          big=$(find src public -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -size +2560k)
          if [ -n "$big" ]; then
            echo "These images are over 2.5MB — compress before committing:"
            echo "$big"
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: pnpm build
