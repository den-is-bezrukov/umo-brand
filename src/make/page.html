    <meta name="theme-color" content="#ffffff" />
    <!-- The link's card in messengers: the site's social image (site.config.json, Figma 4876:3660), set here as this page
         is built apart from the others -->

    <meta property="og:title" content="Материалы для дилеров UMO" />
    <meta property="og:description" content="Прайс-карты, ценники, визитки и другие материалы UMO — с Алисой AI или в редакторе" />
    <meta property="og:image" content="https://umo.autos/social-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://umo.autos/social-image.png" />
    <!-- For an agent given this page: the instruction as plain text (it's also below, hidden) -->
    <link rel="alternate" type="text/plain" href="/llms.txt" />
    <!-- Yandex.Metrika counter: on umo.autos only, as in index.html -->
    <script>
      if (location.hostname === 'umo.autos') {
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=113514674', 'ym');
        ym(113514674, 'init', {ssr:true, webvisor:true, clickmap:true, accurateTrackBounce:true, trackLinks:true});

    </script>
    <style>
      @font-face { font-family: 'CoFo Sans'; font-weight: 400; font-display: swap; src: url('/fonts/CoFoSans-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'CoFo Sans'; font-weight: 500; font-display: swap; src: url('/fonts/CoFoSans-Medium.woff2') format('woff2'); }
      /* The Alice mark on @, as in the guide (src/index.css) */
      @font-face { font-family: 'Alice Okniks'; font-weight: 400 700; font-display: swap; src: url('/fonts/AliceOkniks.woff') format('woff'); unicode-range: U+002A, U+0040, U+005E, U+00A0; }
      .alice { font-family: 'Alice Okniks'; font-feature-settings: 'ss02'; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff; color: #000; font: 400 14px/16px 'CoFo Sans', sans-serif; -webkit-font-smoothing: antialiased; }
      /* The logo on top, as the guide's header (120×24, 24 px in), centred; the form centred on the screen under it,
         an empty row as tall as the logo's mirroring it at the foot */
      main { display: flex; flex-direction: column; min-height: 100dvh; max-width: 336px; margin: 0 auto; padding: 24px; }
      main::after { content: ''; flex: none; height: 24px; }
      .form { margin: auto 0; padding: 48px 0; }
      a { color: inherit; }
      .home { align-self: center; }
      .logo { display: block; width: 120px; height: 24px; }
      h1 { margin: 0; font-weight: 500; font-size: 24px; line-height: 28px; letter-spacing: -0.01em; text-align: center; }
      .main { margin-top: 32px; }
      .group { display: grid; gap: 8px; }
      .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 14px 16px; border: 1px solid rgb(0 0 0 / 0.1); border-radius: 8px; background: #fff; color: inherit; font: inherit; font-size: 16px; line-height: 20px; text-decoration: none; text-align: left; cursor: pointer; }
      .btn:hover { border-color: rgb(0 0 0 / 0.4); }
      /* Alice in her own colour (the «Войти» on alice.yandex.ru): the chat most dealers have */
      .btn.alice-btn { background: #7a55ff; border-color: #7a55ff; color: #fff; }
      .btn.alice-btn:hover { background: #6a45ef; border-color: #6a45ef; }
      /* The chats' names at 16 px, after their marks in one 20 px slot, so the names start in line */
      .chat { display: flex; align-items: center; gap: 10px; font-size: 16px; line-height: 20px; font-weight: 500; }
      .icon { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; }
      /* The generator, as the generators' «Скачать»: black, Medium */
      .btn.cta { background: #000; border-color: #000; color: #fff; font-weight: 500; }
      .btn.cta:hover { background: #333; border-color: #333; }
      .icon.alice { font-size: 20px; line-height: 20px; }
      /* «Сделать с @ Алисой AI»: her mark inside the phrase, a word space either side */
      .alice-btn .chat { gap: 4px; }
      /* The copy, a secondary button in the stack under the two ways, 8 px apart as they are */
      .btn.copy { width: 100%; margin-top: 8px; }
      /* The instruction as text, grey as the summaries, the ↗ 8 px off it as the guide's page rows */
      .doc { display: flex; justify-content: center; gap: 8px; margin-top: 24px; color: #808080; text-decoration: none; }
      .doc:hover { color: #000; }
      .doc span { font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <a class="home" href="/" aria-label="UMO">
        <svg class="logo" viewBox="0 0 480 96" fill="currentColor" aria-hidden="true">
          <path d="M218.401 34.8H182.399V96H146.4V34.6746C146.4 10.0442 158.096 0 182.399 0H218.401V34.8ZM290.398 0C314.693 0 326.4 10.0299 326.4 34.6746V96H290.398V34.8H254.399V96H218.401V34.8H254.399V0H290.398Z" />
          <path d="M98.4 61.2H36V0H0V61.3254C0 85.9702 11.7204 96 36.0301 96H98.3663C122.694 96 134.4 85.9558 134.4 61.3254V0H98.4V61.2Z" />
          <path fill-rule="evenodd" clip-rule="evenodd" d="M443.973 0C468.284 0 480 10.0299 480 34.6746V61.3254C480 85.9558 468.299 96 443.973 96H374.43C350.116 96 338.4 85.9702 338.4 61.3254V34.6746C338.4 10.0442 350.116 0 374.43 0H443.973ZM374.4 61.2H444V34.6746L374.4 34.8V61.2Z" />
        </svg>
      </a>
      <div class="form">
        <h1>Материалы для дилеров</h1>
        <div class="group main">
          <a class="btn alice-btn" data-chat="alice" target="_blank" rel="noopener"><span class="chat">Сделать с<span class="icon alice">@</span>Алисой AI</span></a>
          <a class="btn cta" href="/price-card">Собрать в редакторе</a>
        </div>
        <button class="btn copy" data-chat="copy" type="button"><span>Скопировать инструкцию для ИИ</span></button>
        <a class="doc" href="/llms.txt" target="_blank" rel="noopener"><span aria-hidden="true">↗</span>Текст инструкции</a>
        <!-- The instruction for Alice's button to send and the copy to copy, hidden: people open it as text above, agents read it here -->
        <pre id="instruction" hidden><!-- ai:instruction --></pre>
      </div>
    </main>
    <script>
      // Alice reads no links, so she gets the instruction itself in her field; the copy is for any other chat
      var instruction = 'Следуй этой инструкции и помоги мне сделать материалы UMO.\n\n' + document.getElementById('instruction').textContent
      var links = {
        // «Эксперт» (model): in «Авто» a free-form answer goes to her search, which forgets the instruction
        alice: 'https://alice.yandex.ru/?model=alice-agents-expert&set_text=' + encodeURIComponent(instruction),
      }
      function goal(chat) {
        if (window.ym) ym(113514674, 'reachGoal', 'ai_open', { chat: chat })
      }
      function copied(button) {
        var label = button.querySelector('span')
        var text = label.textContent
        label.textContent = 'Инструкция скопирована'
        setTimeout(function () { label.textContent = text }, 2000)
      }
      document.querySelectorAll('[data-chat]').forEach(function (el) {
        var chat = el.dataset.chat
        if (links[chat]) el.href = links[chat]
        el.addEventListener('click', function () {
          goal(chat)
          if (chat === 'copy') navigator.clipboard.writeText(instruction).then(function () { copied(el) })
        })
      })
    </script>
  </body>
</html>
