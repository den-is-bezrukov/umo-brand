    <style>
      @font-face { font-family: 'CoFo Sans'; font-weight: 400; font-display: swap; src: url('/fonts/CoFoSans-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'CoFo Sans'; font-weight: 500; font-display: swap; src: url('/fonts/CoFoSans-Medium.woff2') format('woff2'); }
      /* The Alice mark on @, as in the guide (src/index.css) */
      @font-face { font-family: 'Alice Okniks'; font-weight: 400 700; font-display: swap; src: url('/fonts/AliceOkniks.woff') format('woff'); unicode-range: U+002A, U+0040, U+005E, U+00A0; }
      .alice { font-family: 'Alice Okniks'; font-feature-settings: 'ss02'; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff; color: #000; font: 400 14px/16px 'CoFo Sans', sans-serif; -webkit-font-smoothing: antialiased; }
      main { max-width: 336px; margin: 0 auto; padding: 24px 24px 48px; }
      a { color: inherit; }
      .logo { display: block; width: 100%; height: auto; aspect-ratio: 5 / 1; }
      h1 { margin: 24px 0 0; font-weight: 500; font-size: 24px; line-height: 28px; letter-spacing: -0.01em; }
      .label { margin: 40px 0 12px; color: #808080; }
      .group { display: grid; gap: 8px; }
      .btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 14px 16px; border: 1px solid rgb(0 0 0 / 0.1); border-radius: 8px; background: #fff; color: inherit; font: inherit; text-decoration: none; text-align: left; cursor: pointer; }
      .btn:hover { border-color: rgb(0 0 0 / 0.4); }
      .btn svg { flex: none; width: 12px; height: 12px; fill: none; stroke: #808080; stroke-width: 2; stroke-linecap: square; stroke-linejoin: bevel; }
      .btn:hover svg { stroke: #000; }
      /* Alice in her own colour (the «Войти» on alice.yandex.ru): the chat most dealers have */
      .btn.alice-btn { background: #7a55ff; border-color: #7a55ff; color: #fff; }
      .btn.alice-btn:hover { background: #6a45ef; border-color: #6a45ef; }
      .btn.alice-btn svg, .btn.alice-btn:hover svg { stroke: #fff; }
      /* ChatGPT black and Claude's clay, each with its mark (Simple Icons) */
      .btn.chatgpt-btn { background: #000; border-color: #000; color: #fff; }
      .btn.chatgpt-btn:hover { background: #333; border-color: #333; }
      .btn.claude-btn { background: #d97757; border-color: #d97757; color: #fff; }
      .btn.claude-btn:hover { background: #c96747; border-color: #c96747; }
      :is(.chatgpt-btn, .claude-btn) svg, :is(.chatgpt-btn, .claude-btn):hover svg { stroke: #fff; }
      /* The chats' names at 16 px, after their marks in one 20 px slot, so the names start in line */
      .chat { display: flex; align-items: center; gap: 10px; font-size: 16px; line-height: 20px; font-weight: 500; }
      .icon { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; }
      .btn .icon svg { width: 18px; height: 18px; fill: #fff; stroke: none; }
      .icon.alice { font-size: 20px; line-height: 20px; }
      details { margin-top: 48px; }
      summary { display: inline-flex; align-items: center; gap: 6px; color: #808080; cursor: pointer; list-style: none; }
      summary svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.25; transition: transform 0.2s; }
      details[open] summary svg { transform: rotate(180deg); }
      summary::-webkit-details-marker { display: none; }
      summary:hover { color: #000; }
      pre { margin: 16px 0 0; white-space: pre-wrap; font: inherit; line-height: 20px; color: #808080; }
    </style>

    <script>
      // The chats that read a link get a line pointing to llms.txt; Alice reads no links, so she gets the instruction
      // itself in her field
      var instruction = 'Следуй этой инструкции и помоги мне сделать материалы UMO.\n\n' + document.getElementById('instruction').textContent
      var ask = 'Прочитай https://umo.autos/llms.txt и следуй инструкции оттуда: помоги мне сделать материалы UMO.'
      var q = encodeURIComponent
      var links = {
        alice: 'https://alice.yandex.ru/?set_text=' + q(instruction),
        chatgpt: 'https://chatgpt.com/?prompt=' + q(ask),
        claude: 'https://claude.ai/new?q=' + q(ask),
      }
      function goal(chat) {
        if (window.ym) ym(113514674, 'reachGoal', 'ai_open', { chat: chat })
      }
      function copied(button) {
        var label = button.querySelector('span')
        var text = label.textContent
        label.textContent = 'Инструкция скопирована'
        setTimeout(function () { label.textContent = text }, 2000)
      }
      document.querySelectorAll('[data-chat]').forEach(function (el) {
        var chat = el.dataset.chat
        if (links[chat]) el.href = links[chat]
        el.addEventListener('click', function () {
          goal(chat)
          if (chat === 'copy') navigator.clipboard.writeText(instruction).then(function () { copied(el) })
        })
      })
    </script>
