<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Материалы для дилеров UMO</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Yandex.Metrika counter: on umo.autos only, as in index.html -->
    <script>
      if (location.hostname === 'umo.autos') {
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=113514674', 'ym');
        ym(113514674, 'init', {ssr:true, webvisor:true, clickmap:true, accurateTrackBounce:true, trackLinks:true});
      }
    </script>
    <style>
      @font-face { font-family: 'CoFo Sans'; font-weight: 400; font-display: swap; src: url('/fonts/CoFoSans-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'CoFo Sans'; font-weight: 500; font-display: swap; src: url('/fonts/CoFoSans-Medium.woff2') format('woff2'); }
      /* The Alice mark on @, as in the guide (src/index.css) */
      @font-face { font-family: 'Alice Okniks'; font-weight: 400 700; font-display: swap; src: url('/fonts/AliceOkniks.woff') format('woff'); unicode-range: U+002A, U+0040, U+005E, U+00A0; }
      .alice { font-family: 'Alice Okniks'; font-feature-settings: 'ss02'; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff; color: #000; font: 400 14px/16px 'CoFo Sans', sans-serif; -webkit-font-smoothing: antialiased; }
      main { max-width: 368px; margin: 0 auto; padding: 24px 24px 48px; }
      a { color: inherit; }
      .logo { display: block; width: 80px; height: 16px; }
      h1 { margin: 40px 0 0; font-weight: 500; font-size: 24px; line-height: 28px; letter-spacing: -0.01em; }
      .label { margin: 40px 0 12px; color: #808080; }
      .group { display: grid; gap: 8px; }
      .btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 16px; border: 1px solid rgb(0 0 0 / 0.1); border-radius: 8px; background: #fff; color: inherit; font: inherit; text-decoration: none; text-align: left; cursor: pointer; }
      .btn:hover { border-color: rgb(0 0 0 / 0.4); }
      .btn svg { flex: none; width: 12px; height: 12px; fill: none; stroke: #808080; stroke-width: 2; stroke-linecap: square; stroke-linejoin: bevel; }
      .btn:hover svg { stroke: #000; }
      details { margin-top: 48px; }
      summary { color: #808080; cursor: pointer; list-style: none; }
      summary::-webkit-details-marker { display: none; }
      summary:hover { color: #000; }
      pre { margin: 16px 0 0; white-space: pre-wrap; font: inherit; line-height: 20px; color: #808080; }
    </style>
  </head>
  <body>
    <main>
      <a href="/" aria-label="UMO">
        <svg class="logo" viewBox="0 0 480 96" fill="currentColor" aria-hidden="true">
          <path d="M218.401 34.8H182.399V96H146.4V34.6746C146.4 10.0442 158.096 0 182.399 0H218.401V34.8ZM290.398 0C314.693 0 326.4 10.0299 326.4 34.6746V96H290.398V34.8H254.399V96H218.401V34.8H254.399V0H290.398Z" />
          <path d="M98.4 61.2H36V0H0V61.3254C0 85.9702 11.7204 96 36.0301 96H98.3663C122.694 96 134.4 85.9558 134.4 61.3254V0H98.4V61.2Z" />
          <path fill-rule="evenodd" clip-rule="evenodd" d="M443.973 0C468.284 0 480 10.0299 480 34.6746V61.3254C480 85.9558 468.299 96 443.973 96H374.43C350.116 96 338.4 85.9702 338.4 61.3254V34.6746C338.4 10.0442 350.116 0 374.43 0H443.973ZM374.4 61.2H444V34.6746L374.4 34.8V61.2Z" />
        </svg>
      </a>
      <h1>Материалы для дилеров</h1>

      <div class="label">С помощью ИИ</div>
      <div class="group">
        <a class="btn" data-chat="alice" target="_blank" rel="noopener"><span><span class="alice">@</span> Алиса</span><svg viewBox="0 0 16 16"><path d="M5 3h8v8M13 3 3 13" /></svg></a>
        <a class="btn" data-chat="chatgpt" target="_blank" rel="noopener">ChatGPT<svg viewBox="0 0 16 16"><path d="M5 3h8v8M13 3 3 13" /></svg></a>
        <a class="btn" data-chat="claude" target="_blank" rel="noopener">Claude<svg viewBox="0 0 16 16"><path d="M5 3h8v8M13 3 3 13" /></svg></a>
        <a class="btn" data-chat="grok" target="_blank" rel="noopener">Grok<svg viewBox="0 0 16 16"><path d="M5 3h8v8M13 3 3 13" /></svg></a>
        <button class="btn" data-chat="copy" type="button"><span>Скопировать инструкцию для другого ИИ</span></button>
      </div>

      <div class="label">Вручную</div>
      <div class="group">
        <a class="btn" href="/price-card">Прайс-карта в конструкторе<svg viewBox="0 0 16 16"><path d="M9 3l5 5-5 5M14 8H2" /></svg></a>
      </div>

      <details>
        <summary>Инструкция для ИИ</summary>
        <pre id="instruction"><!-- ai:instruction --></pre>
      </details>
    </main>
    <script>
      // The chats that read a link get a line pointing to llms.txt; Alice reads no links, so she gets the instruction
      // itself in her field
      var instruction = 'Следуй этой инструкции и помоги мне сделать материалы UMO.\n\n' + document.getElementById('instruction').textContent
      var ask = 'Прочитай https://umo.autos/llms.txt и следуй инструкции оттуда: помоги мне сделать материалы UMO.'
      var q = encodeURIComponent
      var links = {
        alice: 'https://alice.yandex.ru/?set_text=' + q(instruction),
        chatgpt: 'https://chatgpt.com/?prompt=' + q(ask),
        claude: 'https://claude.ai/new?q=' + q(ask),
        grok: 'https://grok.com/?q=' + q(ask),
      }
      function goal(chat) {
        if (window.ym) ym(113514674, 'reachGoal', 'ai_open', { chat: chat })
      }
      function copied(button) {
        var label = button.querySelector('span')
        var text = label.textContent
        label.textContent = 'Инструкция скопирована'
        setTimeout(function () { label.textContent = text }, 2000)
      }
      document.querySelectorAll('[data-chat]').forEach(function (el) {
        var chat = el.dataset.chat
        if (links[chat]) el.href = links[chat]
        el.addEventListener('click', function () {
          goal(chat)
          if (chat === 'copy') navigator.clipboard.writeText(instruction).then(function () { copied(el) })
        })
      })
    </script>
  </body>
</html>
